name: Deploy Cypher Heirs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public application source
        uses: actions/checkout@v4
      - name: Set up contract-test runtime
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install pinned UI dependencies
        run: pnpm install --frozen-lockfile
      - name: Check standalone data and Pine contracts
        run: pnpm test
      - name: Build static application
        run: pnpm build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
